# Supabase local configuration for DP Skill Tech Academy
project_id = "dpskilltech-academy"

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://www.dpskilltech.in"]
jwt_expiry = 604800
enable_signup = false # Rule 5: Student accounts are NOT self-registration accounts

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enrollment_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"
